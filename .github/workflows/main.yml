name: Build Android APK

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Find and extract project ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "No ZIP file found in repository root"
        exit 1
      fi
      mkdir project
      unzip -q "$ZIP_FILE" -d project
      find project -maxdepth 4 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Build APK
    run: |
      GRADLEW=$(find project -type f -name gradlew | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "gradlew not found; project structure needs checking"
        exit 1
      fi
      cd "$(dirname "$GRADLEW")"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Smart-PDF-English-Tutor-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
