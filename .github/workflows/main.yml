name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project folder
        id: find
        run: |
          echo "All gradle files:"
          find . -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/node_modules/*"

          if [ -f "./gradlew" ]; then
            DIR="."
          else
            DIR=$(dirname "$(find . -maxdepth 4 -name gradlew -not -path '*/node_modules/*' | head -n 1)")
          fi

          if [ -z "$DIR" ] || [ "$DIR" = "." ] && [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Using system gradle."
            DIR=$(dirname "$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
            echo "use_system_gradle=true" >> $GITHUB_OUTPUT
          else
            echo "use_system_gradle=false" >> $GITHUB_OUTPUT
          fi

          echo "Project dir: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build with gradlew
        if: steps.find.outputs.use_system_gradle == 'false'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build with system gradle (fallback)
        if: steps.find.outputs.use_system_gradle == 'true'
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: List generated APKs
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-123-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
